<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雅思 Task 2 写作题库 · 话题与题型练习</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    background: #f4f5fa;
    color: #2d3142;
    line-height: 1.6;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }

  /* 顶部 banner */
  .banner {
    background: linear-gradient(120deg, #6c5ce7 0%, #8b7cf6 100%);
    border-radius: 14px;
    padding: 26px 30px;
    color: #fff;
    margin-bottom: 22px;
    box-shadow: 0 8px 24px rgba(108, 92, 231, .25);
  }
  .banner h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .banner p { margin-top: 8px; font-size: 14px; opacity: .9; }

  /* 筛选区 */
  .panel {
    background: #fff;
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(45, 49, 66, .06);
  }
  .filter-row { display: flex; align-items: flex-start; margin-bottom: 16px; }
  .filter-row:last-child { margin-bottom: 0; }
  .filter-label {
    flex: 0 0 56px;
    font-size: 15px;
    font-weight: 600;
    color: #555a70;
    padding-top: 7px;
  }
  .filter-btns { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }
  .chip {
    border: 1px solid #e4e6f0;
    background: #f7f8fc;
    color: #4a4f66;
    border-radius: 9px;
    padding: 7px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .chip:hover { border-color: #b3a9f5; color: #6c5ce7; }
  .chip.active {
    background: #6c5ce7;
    border-color: #6c5ce7;
    color: #fff;
    box-shadow: 0 4px 12px rgba(108, 92, 231, .3);
  }
  .chip .num { font-size: 12px; opacity: .7; margin-left: 3px; }
  .chip.active .num { opacity: .9; }

  .search-box { position: relative; margin-bottom: 18px; }
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border: 1px solid #e4e6f0;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .search-box input:focus { border-color: #6c5ce7; }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
  }
  .result-meta { font-size: 13px; color: #8a8fa3; margin-bottom: 12px; }

  /* 题目列表 */
  .list { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(45,49,66,.06); }
  .list-head {
    display: flex;
    justify-content: space-between;
    padding: 16px 24px;
    background: #fafbff;
    border-bottom: 1px solid #eef0f7;
    font-weight: 700;
    font-size: 15px;
  }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    padding: 18px 24px;
    border-bottom: 1px solid #f0f1f6;
    cursor: pointer;
    transition: background .15s;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: #f8f7ff; }
  .item-main { flex: 1; min-width: 0; }
  .item-title {
    font-size: 15px;
    color: #2d3142;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 9px; }
  .item-date { font-size: 13px; color: #9a9eb0; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 5px; font-weight: 500; }
  .tag-code { background: #ffe9ec; color: #f5576c; }
  .tag-type { background: #e8f0fe; color: #4263eb; }
  .tag-cat  { background: #e6f7f0; color: #0ca678; }
  .btn-essay {
    flex: 0 0 auto;
    border: 1px solid #6c5ce7;
    color: #6c5ce7;
    background: #fff;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-essay:hover { background: #6c5ce7; color: #fff; }
  .empty { text-align: center; padding: 60px 0; color: #9a9eb0; font-size: 14px; }

  .pager { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 22px; }
  .pager button {
    border: 1px solid #e4e6f0;
    background: #fff;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    color: #4a4f66;
  }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager .page-info { font-size: 13px; color: #8a8fa3; padding: 0 6px; }

  /* 详情弹层 */
  .modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 32, 48, .55);
    z-index: 100;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 900px;
    overflow: hidden;
    animation: pop .2s ease;
  }
  @keyframes pop { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head {
    padding: 24px 28px 18px;
    border-bottom: 1px solid #eef0f7;
    position: relative;
  }
  .modal-close {
    position: absolute;
    right: 20px;
    top: 18px;
    width: 34px;
    height: 34px;
    border: none;
    background: #f2f3f8;
    border-radius: 50%;
    font-size: 17px;
    cursor: pointer;
    color: #666;
  }
  .modal-close:hover { background: #e7e8f0; }
  .modal-title { font-size: 17px; font-weight: 700; padding-right: 44px; }
  .modal-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  .tabs { display: flex; gap: 4px; padding: 0 28px; border-bottom: 1px solid #eef0f7; }
  .tab {
    padding: 14px 22px;
    font-size: 15px;
    cursor: pointer;
    color: #8a8fa3;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    user-select: none;
  }
  .tab.active { color: #6c5ce7; border-bottom-color: #6c5ce7; font-weight: 600; }
  .tab-body { padding: 26px 28px 34px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .tab-pane .text {
    white-space: pre-line;
    font-size: 15px;
    color: #3a3f55;
    line-height: 1.9;
  }
  .tab-pane.essay .text { font-family: Georgia, "Times New Roman", serif; }
  .tab-pane.vocab .text { font-size: 14.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <h1>按照话题及题型针对性练习</h1>
    <p>雅思写作 Task 2 高分范文题库 · 共 <b id="totalCount">0</b> 题（思路解析 / 范文 / 语言积累）</p>
  </div>

  <div class="panel">
    <div class="filter-row">
      <div class="filter-label">话题：</div>
      <div class="filter-btns" id="categoryFilters"></div>
    </div>
    <div class="filter-row">
      <div class="filter-label">题型：</div>
      <div class="filter-btns" id="typeFilters"></div>
    </div>
  </div>

  <div class="panel">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索题干关键词，如 parenting、technology、environment…">
    </div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="list">
      <div class="list-head"><span>题目</span><span>高分范文</span></div>
      <div id="questionList"></div>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<!-- 详情弹层 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <button class="modal-close" id="modalClose" title="关闭 (Esc)">✕</button>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-meta" id="modalMeta"></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="analysis">思路解析</div>
      <div class="tab" data-tab="essay">范文</div>
      <div class="tab" data-tab="vocab">语言积累</div>
    </div>
    <div class="tab-body">
      <div class="tab-pane active" data-pane="analysis"><div class="text" id="paneAnalysis"></div></div>
      <div class="tab-pane essay" data-pane="essay"><div class="text" id="paneEssay"></div></div>
      <div class="tab-pane vocab" data-pane="vocab"><div class="text" id="paneVocab"></div></div>
    </div>
  </div>
</div>

<script src="data/app-data.js"></script>
<script>
(function () {
  var DATA = window.APP_DATA || { topics: [], categories: [], types: [] };
  var PAGE_SIZE = 20;

  var state = { category: '全部', type: '全部', keyword: '', page: 1, current: null };

  var $ = function (id) { return document.getElementById(id); };
  var totalCount = $('totalCount');
  var categoryFilters = $('categoryFilters');
  var typeFilters = $('typeFilters');
  var searchInput = $('searchInput');
  var questionList = $('questionList');
  var resultMeta = $('resultMeta');
  var pager = $('pager');
  var modalMask = $('modalMask');

  totalCount.textContent = DATA.total;

  function buildFilters(container, values, key) {
    var all = ['全部'].concat(values);
    container.innerHTML = '';
    all.forEach(function (v) {
      var btn = document.createElement('button');
      btn.className = 'chip' + (state[key === 'category' ? 'category' : 'type'] === v ? ' active' : '');
      var n;
      if (key === 'category') {
        n = v === '全部'
          ? DATA.topics.filter(function (t) { return state.type === '全部' || t.type === state.type; }).length
          : DATA.topics.filter(function (t) { return t.category === v && (state.type === '全部' || t.type === state.type); }).length;
      } else {
        n = v === '全部'
          ? DATA.topics.filter(function (t) { return state.category === '全部' || t.category === state.category; }).length
          : DATA.topics.filter(function (t) { return t.type === v && (state.category === '全部' || t.category === state.category); }).length;
      }
      btn.innerHTML = v + '<span class="num">' + n + '</span>';
      btn.onclick = function () {
        if (key === 'category') state.category = v; else state.type = v;
        state.page = 1;
        render();
      };
      container.appendChild(btn);
    });
  }

  function filtered() {
    var kw = state.keyword.trim().toLowerCase();
    return DATA.topics.filter(function (t) {
      var catOk = state.category === '全部' || t.category === state.category;
      var typeOk = state.type === '全部' || t.type === state.type;
      var kwOk = !kw || t.title.toLowerCase().indexOf(kw) > -1;
      return catOk && typeOk && kwOk;
    });
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderList(rows) {
    if (!rows.length) {
      questionList.innerHTML = '<div class="empty">没有符合条件的题目，换个筛选条件试试～</div>';
      pager.innerHTML = '';
      return;
    }
    var totalPages = Math.ceil(rows.length / PAGE_SIZE);
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * PAGE_SIZE;
    var pageRows = rows.slice(start, start + PAGE_SIZE);

    questionList.innerHTML = pageRows.map(function (t) {
      return '<div class="item" data-id="' + t.id + '">' +
        '<div class="item-main">' +
          '<div class="item-title">' + esc(t.title) + '</div>' +
          '<div class="item-meta">' +
            '<span class="item-date">' + esc(t.date) + '</span>' +
            '<span class="tag tag-code">' + esc(t.code) + '</span>' +
            '<span class="tag tag-type">' + esc(t.type) + '</span>' +
            '<span class="tag tag-cat">' + esc(t.category) + '</span>' +
          '</div>' +
        '</div>' +
        '<button class="btn-essay" data-id="' + t.id + '">范文</button>' +
      '</div>';
    }).join('');

    pager.innerHTML =
      '<button id="prevPage"' + (state.page === 1 ? ' disabled' : '') + '>上一页</button>' +
      '<span class="page-info">第 ' + state.page + ' / ' + totalPages + ' 页</span>' +
      '<button id="nextPage"' + (state.page === totalPages ? ' disabled' : '') + '>下一页</button>';
    $('prevPage').onclick = function () { state.page--; render(); };
    $('nextPage').onclick = function () { state.page++; render(); };
  }

  function openDetail(id) {
    var t = DATA.topics.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    state.current = t;
    $('modalTitle').textContent = t.title;
    $('modalMeta').innerHTML =
      '<span class="item-date">' + esc(t.date) + '</span>' +
      '<span class="tag tag-code">' + esc(t.code) + '</span>' +
      '<span class="tag tag-type">' + esc(t.type) + '</span>' +
      '<span class="tag tag-cat">' + esc(t.category) + '</span>';
    $('paneAnalysis').textContent = t.analysis || '暂无内容';
    $('paneEssay').textContent = t.essay || '暂无内容';
    $('paneVocab').textContent = t.vocabulary || '暂无内容';
    document.querySelectorAll('.tab').forEach(function (el) { el.classList.remove('active'); });
    document.querySelectorAll('.tab-pane').forEach(function (el) { el.classList.remove('active'); });
    document.querySelector('.tab[data-tab="analysis"]').classList.add('active');
    document.querySelector('.tab-pane[data-pane="analysis"]').classList.add('active');
    modalMask.classList.add('show');
  }

  function closeDetail() { modalMask.classList.remove('show'); state.current = null; }

  function render() {
    buildFilters(categoryFilters, DATA.categories, 'category');
    buildFilters(typeFilters, DATA.types, 'type');
    var rows = filtered();
    resultMeta.textContent = '当前筛选结果：' + rows.length + ' 题';
    renderList(rows);
  }

  // 事件绑定
  questionList.addEventListener('click', function (e) {
    var target = e.target.closest('[data-id]');
    if (target) openDetail(Number(target.getAttribute('data-id')));
  });
  searchInput.addEventListener('input', function () {
    state.keyword = searchInput.value;
    state.page = 1;
    render();
  });
  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      var name = tab.getAttribute('data-tab');
      document.querySelectorAll('.tab').forEach(function (el) { el.classList.remove('active'); });
      document.querySelectorAll('.tab-pane').forEach(function (el) { el.classList.remove('active'); });
      tab.classList.add('active');
      document.querySelector('.tab-pane[data-pane="' + name + '"]').classList.add('active');
    });
  });
  $('modalClose').onclick = closeDetail;
  modalMask.addEventListener('click', function (e) { if (e.target === modalMask) closeDetail(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });

  render();
})();
</script>
</body>
</html>
